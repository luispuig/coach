<title>Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap">
<style>
/* Layout: native iOS-style shell. Blurred header and tab bar, grouped cards, every control in the thumb zone. One bold moment: the rest ring. */
:root {
  --bg: #F2F3F7;
  --surface: #FFFFFF;
  --surface-2: #F7F8FB;
  --fg: #0E1726;
  --muted: #6B7383;
  --line: #E4E7EE;
  --blue: #2F6BFF;
  --sky: #13B5FF;
  --coral: #FF5A4E;
  --sun: #FFC531;
  --mint: #18B87A;
  --on-color: #FFFFFF;
  --screen: #FFFFFF;
  --shadow: 0 1px 2px rgba(14, 23, 38, .05), 0 10px 30px rgba(14, 23, 38, .07);
  --glass: rgba(242, 243, 247, .78);
  --ease-ios: cubic-bezier(.32, .72, 0, 1);
  color-scheme: light;
  --num: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

html, body { height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; touch-action: pan-x pan-y; }
body { position: fixed; inset: 0; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--text); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-user-select: none; user-select: none; }
button:focus-visible, input:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--blue) 55%, transparent); outline-offset: 2px; }
input, textarea { font: inherit; color: var(--fg); }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.press { transition: transform .18s var(--ease-ios), opacity .18s; }
.press:active, button:active { transform: scale(.97); }

#app { height: 100%; width: 100%; position: relative; overflow: hidden; --gut: max(16px, calc((100% - 560px) / 2)); }
.screen { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.dock { position: relative; z-index: 3; flex: none; }
.dock > .bar:last-child { padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
.top { position: relative; z-index: 3; padding: max(12px, env(safe-area-inset-top, 0px)) 16px 10px; display: flex; align-items: center; gap: 8px; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
.top h1 { font-family: var(--num); font-weight: 800; font-size: 32px; line-height: 1.2; margin: 0; flex: 1; min-width: 0; text-wrap: balance; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .back { width: 40px; height: 40px; margin-left: -8px; font-size: 30px; line-height: 1; display: grid; place-items: center; color: var(--blue); }
.clock { font-family: var(--num); font-weight: 600; font-size: 20px; color: var(--muted); padding: 0 4px; }
main { flex: 1 1 0; min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: none; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 20px; }
main > * { flex-shrink: 0; }
.bar { padding: 10px 16px 10px; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); display: flex; gap: 10px; align-items: center; }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 8px max(6px, env(safe-area-inset-bottom, 0px)); background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--line); }
.tabs button { padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 50px; }
.tabs button svg { width: 26px; height: 26px; padding: 2px; border-radius: 10px; transition: background .25s, color .25s; }
.tabs button[aria-current="page"] { color: var(--blue); }
.tabs button[aria-current="page"] svg { background: color-mix(in srgb, var(--blue) 14%, transparent); }

.cta { flex: 1; min-height: 56px; border-radius: 18px; background: linear-gradient(135deg, var(--blue), var(--sky)); color: var(--on-color); font-weight: 700; font-size: 18px; box-shadow: 0 8px 22px color-mix(in srgb, var(--blue) 35%, transparent); transition: transform .18s var(--ease-ios); }
.ghost { min-height: 48px; padding: 0 16px; border-radius: 14px; background: var(--surface); font-weight: 650; color: var(--blue); box-shadow: var(--shadow); }
.ghost.slim { min-height: 38px; padding: 0 12px; font-size: 15px; border-radius: 12px; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; background: var(--surface); color: var(--fg); font-size: 15px; box-shadow: var(--shadow); }
.small { font-size: 14px; color: var(--muted); }
.tag { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.ex { background: transparent; border: 1px dashed var(--muted); }
.tag.go { background: var(--blue); color: var(--on-color); }
h2 { font-size: 20px; margin: 0 0 10px; color: var(--fg); font-weight: 750; letter-spacing: -.01em; }

/* Hoy */
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 20px 20px 22px; color: var(--on-color); background: radial-gradient(120% 140% at 100% 0%, var(--sky) 0%, transparent 55%), linear-gradient(160deg, var(--blue), #1E44C8); box-shadow: 0 16px 36px color-mix(in srgb, var(--blue) 30%, transparent); display: flex; flex-direction: column; gap: 6px; }
.hero::before { content: ""; position: absolute; right: -40px; bottom: -70px; width: 260px; height: 260px; border-radius: 50%; border: 14px solid rgba(255, 255, 255, .10); box-shadow: 0 0 0 26px rgba(255, 255, 255, .05), 0 0 0 52px rgba(255, 255, 255, .035); pointer-events: none; }
.hero .k { font-size: 15px; font-weight: 600; opacity: .9; }
.hero .t { font-family: var(--num); font-weight: 800; font-size: 64px; line-height: .9; letter-spacing: .005em; }
.hero .m { font-size: 15px; opacity: .92; max-width: 30ch; }
.hero .hstats { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.hero .hstats span { background: rgba(255, 255, 255, .18); border-radius: 99px; padding: 5px 11px; font-size: 13px; font-weight: 650; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 44px; padding: 0 16px; border-radius: 99px; background: var(--surface); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow); }
.chip.done { background: color-mix(in srgb, var(--mint) 16%, var(--surface)); color: var(--mint); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 12px; color: var(--muted); }
.week div, .week button { padding: 8px 0 9px; border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow); }
.week b { font-family: var(--num); font-size: 19px; color: var(--fg); }
.week .today { outline: 2.5px solid var(--blue); outline-offset: -2.5px; }
.week .done { background: linear-gradient(160deg, var(--mint), #11A06A); color: var(--on-color); }
.week .done b { color: var(--on-color); }
.card { background: var(--surface); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.row { display: flex; align-items: center; gap: 10px; }
.row > .grow { flex: 1; min-width: 0; }
.ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; flex: none; }

/* Día */
.lanes { display: flex; flex-direction: column; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
.lane { display: grid; grid-template-columns: 22px 52px 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; text-align: left; min-height: 72px; width: 100%; position: relative; }
.lane + .lane, .ss + .lane, .lane + .ss, .ss + .ss { border-top: .5px solid var(--line); }
.lane .n { font-family: var(--num); font-size: 22px; font-weight: 800; color: var(--muted); text-align: center; }
.lane .th { width: 52px; height: 52px; border-radius: 14px; background: var(--screen); object-fit: contain; }
.lane .nm { font-weight: 650; }
.lane .meta { font-size: 13px; color: var(--muted); }
.prog { display: flex; gap: 4px; }
.prog i { width: 10px; height: 10px; border-radius: 99px; background: var(--line); transition: background .3s, transform .3s var(--ease-ios); }
.prog i.on { background: var(--mint); transform: scale(1.15); }
.lane.cur { background: color-mix(in srgb, var(--blue) 9%, transparent); }
.lane.fin .nm, .lane.fin .n { color: var(--muted); }
.lane.fin .th { opacity: .55; }
.ss { position: relative; }
.ss::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: linear-gradient(var(--blue), var(--sky)); }
.ss-tit { font-size: 12px; font-weight: 750; color: var(--blue); padding: 10px 0 0 50px; }
.ss .lane + .lane { border-top: .5px solid var(--line); }
.pick-tit { font-family: var(--num); font-weight: 800; font-size: 36px; line-height: 1; margin: 0; }

/* Ejercicio */
.foco { gap: 16px; }
.media { background: var(--screen); border-radius: 26px; overflow: hidden; position: relative; aspect-ratio: 4 / 3; max-height: 36vh; width: 100%; display: grid; place-items: center; box-shadow: var(--shadow); }
.media video, .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.media .zoom { position: absolute; right: 12px; bottom: 12px; width: 38px; height: 38px; border-radius: 99px; background: rgba(14, 23, 38, .7); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #fff; display: grid; place-items: center; font-size: 15px; }
.media .novideo { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: #5B6573; background: rgba(255, 255, 255, .92); padding: 3px 10px; border-radius: 99px; }
.ehead h2 { font-size: 24px; margin: 0; text-wrap: balance; }
.obj { display: flex; flex-wrap: wrap; gap: 6px; }
.obj span { background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 14px; color: var(--muted); box-shadow: var(--shadow); }
.obj b { color: var(--fg); }
.goal { font-size: 15px; line-height: 1.45; background: var(--surface); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); }
.goal b { color: var(--fg); }
.last { font-size: 15px; color: var(--muted); }
.last b { color: var(--fg); font-size: 20px; }
.apply { align-self: flex-start; min-height: 42px; padding: 0 16px; border-radius: 99px; background: linear-gradient(135deg, var(--sun), #FFB000); color: #3A2A00; font-weight: 750; box-shadow: 0 6px 16px color-mix(in srgb, var(--sun) 40%, transparent); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.info { font-size: 15px; background: var(--surface); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.aprox { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding: 12px 14px; border-radius: 18px; background: color-mix(in srgb, var(--sky) 12%, var(--surface)); }
.aprox .num { font-size: 26px; }

.sets { display: flex; flex-direction: column; gap: 10px; }
.set { display: grid; grid-template-columns: 30px 1fr 1fr 58px; gap: 8px; align-items: center; padding: 8px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); transition: background .35s var(--ease-ios); }
.set.lados { grid-template-columns: 30px 1fr 1fr 58px; grid-template-areas: "sn kg kg tk" "sn i d tk"; }
.set.lados .sn { grid-area: sn; } .set.lados .tick { grid-area: tk; }
.set.lados .step:nth-of-type(1) { grid-area: kg; } .set.lados .step:nth-of-type(2) { grid-area: i; } .set.lados .step:nth-of-type(3) { grid-area: d; }
.set.uno { grid-template-columns: 30px 1fr 58px; }
.set .sn { font-family: var(--num); font-size: 26px; font-weight: 800; color: var(--muted); text-align: center; }
.step { display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; background: var(--surface-2); border-radius: 16px; min-height: 58px; }
.step button { height: 58px; font-size: 24px; color: var(--blue); font-weight: 500; }
.step .v { text-align: center; display: flex; flex-direction: column; align-items: center; line-height: 1; min-width: 0; }
.step .v input { width: 100%; text-align: center; border: 0; background: transparent; font-family: var(--num); font-size: 32px; font-weight: 800; padding: 0; }
.step .v input::placeholder { color: color-mix(in srgb, var(--muted) 45%, transparent); }
.step .v small { font-size: 11px; color: var(--muted); font-weight: 600; }
.tick { width: 58px; height: 58px; border-radius: 99px; border: 3px solid var(--line); display: grid; place-items: center; font-size: 26px; font-weight: 800; color: transparent; background: var(--surface); }
.set.ok { background: linear-gradient(135deg, var(--coral), #FF8A3D); color: var(--on-color); }
.set.ok .sn, .set.ok .step .v small { color: rgba(255, 255, 255, .85); }
.set.ok .step { background: transparent; }
.set.ok .step .v input { color: var(--on-color); }
.set.ok .step button { visibility: hidden; }
.set.ok .tick { background: #fff; border-color: #fff; color: var(--coral); }
.set.pop .tick { animation: pop .5s var(--ease-ios); }
@keyframes pop { 0% { transform: scale(.5); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
.navbar { display: grid; grid-template-columns: 58px 1fr 58px; gap: 8px; width: 100%; }
.navbar button { min-height: 56px; border-radius: 18px; background: var(--surface); font-size: 24px; color: var(--blue); box-shadow: var(--shadow); }
.navbar .mid { font-size: 16px; font-weight: 700; color: var(--fg); }
.navbar button:disabled { opacity: .35; }

/* Descanso: anillo de estadio */
.rest { position: relative; z-index: 4; margin: 0 8px 8px; border-radius: 28px; padding: 16px; color: var(--on-color); background: radial-gradient(120% 120% at 0% 0%, var(--sky), transparent 60%), linear-gradient(160deg, var(--blue), #1E44C8); box-shadow: 0 -6px 30px rgba(14, 23, 38, .18); display: grid; grid-template-columns: 128px 1fr; gap: 6px 16px; align-items: center; }
.rest .ring { grid-row: span 3; position: relative; width: 128px; height: 128px; }
.rest .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.rest .ring circle { fill: none; stroke-width: 10; }
.rest .ring .bgc { stroke: rgba(255, 255, 255, .18); }
.rest .ring .fgc { stroke: #fff; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.rest .rt { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--num); font-weight: 800; font-size: 46px; font-variant-numeric: tabular-nums; }
.rest .mark { font-size: 54px; font-weight: 800; line-height: .9; letter-spacing: .01em; }
.rest .rl b { font-family: var(--num); font-size: 19px; }
.rest .rl { font-size: 14px; font-weight: 600; opacity: .9; }
.rest .rn { font-size: 18px; font-weight: 750; line-height: 1.2; }
.rest .rb { display: flex; gap: 8px; grid-column: 1 / -1; }
.rest .rb button { flex: 1; min-height: 46px; border-radius: 14px; background: rgba(255, 255, 255, .2); font-weight: 750; font-size: 16px; }
.rest.warn .ring .fgc { stroke: var(--sun); }
.rest.warn .rt { color: var(--sun); }
.rest.end { background: linear-gradient(160deg, var(--mint), #0E9A63); animation: pulse 1s var(--ease-ios) 2; }
@keyframes pulse { 50% { transform: scale(1.03); } }
main > .rest { position: sticky; bottom: 8px; margin: 8px 0 0; box-shadow: 0 6px 30px rgba(14, 23, 38, .22); }
.rest.mini { grid-template-columns: 60px 1fr auto auto; gap: 10px; padding: 10px 12px; border-radius: 22px; height: 80px; }
.rest.mini .ring { grid-row: auto; width: 60px; height: 60px; }
.rest.mini .ring circle { stroke-width: 12; }
.rest.mini .rt { font-size: 21px; }
.rest.mini .ri { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rest.mini .rn { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rest.mini .rl { font-size: 12px; }
.rest.mini .rl b { font-size: 15px; }
.rest.mini > button { min-height: 44px; padding: 0 12px; border-radius: 12px; background: rgba(255, 255, 255, .2); font-weight: 750; font-size: 15px; }
.rest-ph { flex: none; height: 80px; margin: 8px 0 0; }
.rest.enter { animation: slideUp .45s var(--ease-ios); }

/* Hojas, pausa, visor */
.sheet { position: fixed; inset: 0; z-index: 28; display: flex; align-items: flex-end; justify-content: center; background: rgba(5, 10, 20, .45); }
.sheet > div { background: var(--bg); width: 100%; max-width: 560px; border-radius: 28px 28px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; max-height: 92%; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0, 0, 0, .2); }
.sheet > div.split { overflow: hidden; }
.sheet .sbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: 0 -16px; padding: 0 16px 4px; display: flex; flex-direction: column; gap: 12px; }
.sheet > div::before { content: ""; align-self: center; width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin-bottom: 2px; }
.sheet.enter { animation: fadeIn .3s ease-out; }
.sheet.enter > div { animation: slideUp .48s var(--ease-ios); }
.sheet.leaving { animation: fadeOut .26s ease-in forwards; }
.sheet.leaving > div { animation: slideDown .26s ease-in forwards; }
.sheet h3 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
.lightbox { position: fixed; inset: 0; background: #fff; z-index: 30; display: flex; flex-direction: column; overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); }
.lightbox .tec { color: #0e1726; padding: 0 18px calc(24px + env(safe-area-inset-bottom, 0px)); font-size: 15px; line-height: 1.4; }
.lightbox .tec .tu { background: #eef3ff; border-radius: 14px; padding: 10px 12px; margin-top: 10px; }
.lightbox .tec h3 { font-size: 16px; margin: 14px 0 6px; }
.lightbox .tec ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.lightbox.enter { animation: zoomIn .35s var(--ease-ios); }
.lightbox.leaving { animation: zoomOut .22s ease-in forwards; }
.lightbox video, .lightbox img { width: 100%; max-height: 42vh; object-fit: contain; flex: none; position: sticky; top: 0; background: #fff; z-index: 1; }
.lightbox button { z-index: 3; position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; width: 44px; height: 44px; border-radius: 99px; background: rgba(14, 23, 38, .8); color: #fff; font-size: 20px; }
.pausa { position: fixed; inset: 0; z-index: 25; color: var(--on-color); background: radial-gradient(100% 70% at 50% 0%, var(--sky), transparent 70%), linear-gradient(170deg, var(--blue), #172F8F); display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 14px; padding: 24px 24px calc(24px + env(safe-area-inset-bottom, 0px)); text-align: center; }
.pausa.enter { animation: fadeIn .3s ease-out; }
.pausa.leaving { animation: fadeOut .25s ease-in forwards; }
.pausa .rt { font-family: var(--num); font-weight: 800; font-size: 120px; line-height: .9; }
.pausa .cta { flex: none; background: #fff; color: var(--blue); box-shadow: none; }
.pausa .ghost { background: rgba(255, 255, 255, .16); color: #fff; box-shadow: none; }
.seg { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
.seg button { min-height: 46px; border-radius: 12px; background: var(--surface); font-family: var(--num); font-size: 20px; font-weight: 800; box-shadow: var(--shadow); transition: background .2s, color .2s, transform .2s var(--ease-ios); }
.seg button[aria-pressed="true"] { background: var(--blue); color: var(--on-color); transform: scale(1.06); }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); font-weight: 600; }

jas.", "junto_al_siguiente": false}, {"nombre": "Estiramiento de gemelo", "corto": "Gemelo", "lyfta": "2744", "tecnica": {"claves": ["Manos en la pared, pierna de atrás recta y talón pegado al suelo.", "Pie de atrás apuntando recto a la pared.", "Lleva la cadera hacia la pared hasta notar el gemelo, 30 s sin rebote."], "errores": ["Levantar el talón.", "Pie de atrás girado hacia fuera.", "Doblar la rodilla de atrás (así estira el sóleo, no el gemelo)."]}, "id": "estiramiento-de-gemelo", "tipo": "POSTURA", "series": "2 × 30 s por pierna", "descanso": "-", "ahora": "-", "sube": "Más recorrido, sin rebotes", "nota": "Izquierda primero.", "junto_al_siguiente": false}]}, {"titulo": "Día 5 · Escaleras (domingo, opcional)", "sub": "Intensidad sin impacto · 15-20 min", "calentamiento": "Sube 2 plantas andando tranquilo y 2 un poco más rápido.", "ejercicios": [{"nombre": "Escaleras", "corto": "Escaleras", "lyfta": "4247", "tecnica": {"claves": ["Pisa el escalón con todo el pie y empuja con el glúteo; tronco un poco adelante.", "Brazos activos y respiración marcada.", "Ritmo que puedas mantener las 5 subidas: la primera no es un sprint."], "errores": ["Pisar solo con la punta.", "Seguir si la rodilla pasa de 3/10."]}, "id": "escaleras", "tipo": "CARDIO", "series": "5 subidas", "descanso": "2-3 min (bajando andando)", "ahora": "14 plantas, de 2 en 2", "sube": "Más rápido, o 6 subidas", "nota": "Opcional: si te apetece, suma; si no, no pasa nada. Nunca el día antes de pierna. Si la rodilla pasa de 3/10 o se hincha al día siguiente, se cambia por intervalos en bici. Apunta el tiempo de cada subida.", "junto_al_siguiente": false}]}], "img": {"1765": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCAFAAUADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQID 449": "v/4449.mp4", "1727": "v/1727.mp4", "1768": "v/1768.mp4", "2249": "v/2249.mp4", "2328": "v/2328.mp4", "4201": "v/4201.mp4", "1785": "v/1785.mp4", "2924": "v/2924.mp4", "1626": "v/1626.mp4", "212": "v/212.mp4", "213": "v/213.mp4"}, "portada": "<details><summary>Flexibilidad</summary>\n  <p><b>Flexibilidad.</b> Puedes cambiar el orden de los días (por ejemplo Torso B → Pierna A → Torso A → Pierna B). Nunca dos días de pierna seguidos, y mejor no dos de torso seguidos. Dentro del día, los de fuerza van primero; el resto, en el orden que te deje el gimnasio. Las superseries van juntas como bloque.</p>\n  <p>Sesiones de unos 60-65 min con descansos reales. Si vas justo de tiempo, quita antes una serie de los de brazos o de fatiga. Nunca los de fuerza.</p>\n  <p>Semana mala, mínimo: Torso A + Pierna A (40 min cada uno) y 8.000 pasos. Si haces 3 días: 1, 2 y 3.</p>\n\n  </details><details><summary>Tipos de serie</summary>\n  <table class=\"tipos\"><tr><td><span class=\"badge\" style=\"background:#b42318\">Fuerza</span></td><td>6-10 reps · 1-2 en reserva · 2-3 min</td></tr><tr><td><span class=\"badge\" style=\"background:#CA8504\">Moderado</span></td><td>8-15 reps · cerca del fallo · 1,5 min</td></tr><tr><td><span class=\"badge\" style=\"background:#175cd3\">Fatiga</span></td><td>12-25 reps · al fallo · 1,5 min</td></tr><tr><td><span class=\"badge\" style=\"background:#067647\">Postura</span></td><td>control y aguantar</td></tr><tr><td><span class=\"badge\" style=\"background:#5925dc\">Cardio</span></td><td>zona 2</td></tr></table>\n\n  </details><details><summary>Cómo progresar (doble progresión)</summary>\n  <ol>\n    <li>Cada ejercicio tiene un rango, por ejemplo 6-10. Usas el mismo peso en todas las series.</li>\n    <li>Cuando llegas al máximo del rango en <b>todas</b> las series, la siguiente sesión subes peso.</li>\n    <li>Si te quedas corto (tocaban 10 y haces 8), paras y anotas 8. No bajes peso para completar: esa serie cuenta.</li>\n    <li>Solo si caes por const parseNum = (s) => { const m = String(s).match(/(\d+(?:,\d+)?)/); return m ? +m[1].replace(",", ".") : null; };
const seriesInfo = (e, ss = sessSets(e)) => {
  const s = e.series;

  const r = s.match(/× (\d+)(?:-(\d+))?/);

  const kind =

  const total = n === 1 && reps?.max >= 50 ? reps.max : null;

  const sets = total ? ss.filter((z) => z.ok).length + (suma < total ? 1 : 0) || 1 : kind === "parciales" ? +(s.match(/(\d+) subidas/) || [0, 5])[1] : (kind === "minutos" || kind === "hecho") ? 1 : n;

const range = (a, b, st) => Array.from({ length: Math.round((b - a) / st) + 1 }, (_, j) => a + j * st);

};

let audio = null;
const primeAudio = () => {
  try { if (navigator.audioSession) navigator.audioSession.type = "transient"; } catch {}
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch {}
};
const tone = (freq, at, dur, vol = .3) => { const o = audio.createOscillator(); const g = audio.createGain(); o.type = "square"; o.frequency.value = freq; o.connect(g); g.connect(audio.destination); g.gain.setValueAtTime(0, audio.currentTime + at); g.gain.linearRampToValueAtTime(vol, audio.currentTime + at + .02); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + at + dur); o.start(audio.currentTime + at); o.stop(audio.currentTime + at + dur + .05); };
const sound = (fn) => { if (prefs().sonido === false || !audio) return; const go = () => { try { fn(); } catch {} }; if (audio.state === "running") go(); else audio.resume().then(go, () => {}); };
const beepWarn = () => sound(() => { tone(660, 0, .18, .5); tone(660, .3, .18, .5); });
const beep = () => sound(() => { tone(660, 0, .15, .5); tone(880, .18, .15, .5); tone(1175, .36, .5, .55); });
const PREFS_KEY = "coach-proto-prefs";
const prefs = () => { try { return { ...JSON.parse(localStorage.getItem(PREFS_KEY) || "{}"), aviso: 15 }; } catch { return { aviso: 15 }; } };
const startRest = (secs, label) => {
  const elEnd = S.sesion ? Math.floor((elapsed(S.sesion) + secs * 1000) / 1000) : 0;
  fx.rest = true;
  rest = { end: Date.now() + secs * 1000, total: secs, label, done: false, mark: elEnd };
  runTick(); render();
};
const runTick = () => {
  clearInterval(tick);
  tick = setInterval(() => {
    if (!rest) return clearInterval(tick);
    if (S.sesion?.pausaDesde) return;
    const left = Math.ceil((rest.end - Date.now()) / 1000);
    const av = prefs().aviso;
    if (av && left <= av && left > 0 && !rest.warned && rest.total > av + 5) { rest = { ...rest, warned: true }; beepWarn(); document.querySelector(".rest")?.classList.add("warn"); }
    if (left <= 0 && !rest.done) { rest = { ...rest, done: true }; beep(); render(); setTimeout(() => { rest = null; render(); }, 2500); return; }
    const el = document.getElementById("rt");
    if (el) { el.textContent = clock(left); const r = document.getElementById("rring"); if (r) r.style.strokeDashoffset = RING * (1 - Math.max(0, left) / Math.max(1, rest.total)); }
  }, 250);
};
let ctick = null;
const cronoLeft = (c) => Math.round((c.start + c.min * 60000 - Date.now()) / 1000);
const cronoTxt = (left) => (left > 0 ? clock(left) : `+${clock(-left)}`);
const cronoOn = (pre) => (S.sesion && !otherLive() && S.sesion.crono?.key.startsWith(pre) ? S.sesion.crono : null);
const startCrono = (key, min, label) => { primeAudio(); set((s) => ({ ...s, sesion: { ...s.sesion, crono: { key, min, label, start: Date.now() } } })); runCrono(); };
const runCrono = () => {
  clearInterval(ctick);
  ctick = setInterval(() => {
    const c = S.sesion?.crono;
    if (!c) return clearInterval(ctick);
    const left = cronoLeft(c);
    if (left <= 0 && !c.beeped) { set((s) => ({ ...s, sesion: { ...s.sesion, crono: { ...c, beeped: true } } })); beep(); return; }
    const el = document.getElementById("ct");
    if (el) { el.textContent = cronoTxt(left); const r = document.getElementById("cring"); if (r) r.style.strokeDashoffset = RING * (1 - Math.max(0, left) / (c.min * 60)); }
  }, 250);
};
const cronoBand = (c) => {
  const left = cronoLeft(c);
  return `<section class="rest ${left <= 0 ? "warn" : ""}" aria-live="polite"><div class="ring"><svg viewBox="0 0 128 128" aria-hidden="true"><circle class="bgc" cx="64" cy="64" r="56"/><circle class="fgc" id="cring" cx="64" cy="64" r="56" stroke-dasharray="${RING}" style="stroke-dashoffset:${RING * (1 - Math.max(0, left) / (c.min * 60))}"/></svg><span class="rt" id="ct">${cronoTxt(left)}</span></div><span class="rl">${left <= 0 ? `${c.min} min cumplidos 💪 Sigue si quieres` : `Objetivo ${c.min} min`}</span><span class="rn">${esc(c.label)}</span><div class="rb"><button data-cstop>■ Parar y apuntar</button><button data-ccancel style="flex:none;padding:0 14px">Cancelar</button></div></section>`;
};
const clock = (s) => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.max(0, s) % 60).padStart(2, "0")}`;

let lock = null;
const wake = async () => { try { lock = await navigator.wakeLock?.request("screen"); } catch {} };
const CARGADA = Date.now();
const wakeAudio = () => {

const coachText = (h) => {
  const d = dayOf(h.dia);
  const hm = (t) => new Date(t).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  const head = `${d.titulo.split(" (")[0].toUpperCase()} · ${DATA.rutina} · fecha: ${h.fecha}${h.inicio ? ` ${hm(h.inicio)}-${hm(h.fin)}` : ""}`;
  const lines = d.ejercicios.map((e, i) => {
    const info = seriesInfo(e, h.series[e.nombre] || []);
    const rango = e.series.replace(" × ", "x").replace(" por pierna", "").replace(" por brazo", "").replace(" por lado", "").replace("hasta ", "").replace("xal fallo", "x fallo");
    const ss = h.series[e.nombre] || [];
    const slots = Array.from({ length: info.sets }, (_, k) => ss[k] || {});
    const kgs = [...new Set(slots.filter((z) => z.ok && z.kg != null).map((z) => z.kg))];
    const kgTxt = kgs.length === 1 ? ` ${fmtKg(kgs[0])}kg` : "";
    const val = (z) => {
      if (!z.ok) return "_";
      if (info.kind === "lados") return `${kgs.length > 1 ? fmtKg(z.kg) + "x" : ""}${z.repsI}+${z.repsD}`;
      if (info.kind === "kg_reps") return `${kgs.length > 1 ? fmtKg(z.kg) + "x" : ""}${z.reps}`;
      if (info.kind === "reps") return `${z.reps}`;
      if (info.kind === "segundos") return `${z.seg}s`;
      if (info.kind === "minutos") return `${z.min} min`;
      if (info.kind === "parciales") return z.t ?? "hecho";
      return "hecho";
    };
    return `${i + 1}. ${e.corto}${h.planB?.[e.nombre] ? " (alternativa)" : ""} ${rango}${kgTxt}: ${slots.map(val).join("/")}${h.notasEj?.[e.nombre] ? ` · nota: ${h.notasEj[e.nombre]}` : ""}`;
  });
  const orden = [...((h.orden || []).length ? [`Orden: ${h.orden.map((n) => n + 1).join(" · ")}`] : []), ...calGenTxt(h)];
  return [head, ...orden, "", ...lines, "", `Duración (min): ${h.duracion ?? ""}`, `Rodilla 0-10: ${h.rodilla ?? ""}`, `Hombro izq 0-10: ${h.hombro ?? ""}`, `Abductora: ${h.abductora ?? ""}`, `Notas: ${h.notas ?? ""}`].join("\n");
};

const records = (h) => {
  const prior = allHist().filter((x) => x !== h);
  return Object.entries(h.series).flatMap(([nombre, sets]) => {
    const best = sets.filter((z) => z.ok && z.kg != null).sort((a, b) => b.kg - a.kg || (b.reps ?? 0) - (a.reps ?? 0))[0];
    if (!best) return [];
    const prev = prior.flatMap((x) => (x.series[nombre] || []).filter((z) => z.ok && z.kg != null));
    if (!prev.length) return [];
    const top = Math.max(...prev.map((z) => z.kg));
    const repsAtTop = Math.max(...prev.filter((z) => z.kg === top).map((z) => z.reps ?? 0));
    return best.kg > top || (best.kg === top && (best.reps ?? 0) > repsAtTop) ? [`${nombre}: ${fmtKg(best.kg)} kg × ${best.reps}`] : [];
  });
};

const PROG = DATA.progreso || { peso: [], cintura: [] };
const DAY = 864e5;
const tt = (f) => new Date(f + "T12:00").getTime();
const tendencia = (pts) => pts.map(([f]) => {
  const t = tt(f);
  const w = pts.map(([g, v]) => [7 - Math.round((t - tt(g)) / DAY), v]).filter(([k]) => k >= 1 && k <= 7);
  return [f, Math.round((w.reduce((a, [k, v]) => a + k * v, 0) / w.reduce((a, [k]) => a + k, 0)) * 10) / 10];
});
const TREND = tendencia(PROG.peso);

const flecha = (d) => (d == null ? "" : Math.abs(d) < 0.05 ? "= igual" : `${d < 0 ? "↓" : "↑"} ${fmtKg(Math.abs(Math.round(d * 10) / 10))}`);

  const p = atOrBefore(TREND, f), p0 = p && cerca(atOrBefore(TREND, iso(new Date(tt(p[0]) - 7 * DAY))), p, 10);

const UI_KEY = "coach-proto-ui";
const closeOverlay = (sel, after) => {
  const el = document.querySelector(sel);
  if (!el || calm()) return after();
  el.classList.add("leaving");
  setTimeout(after, 240);
};
const closeSheet = (after = () => {}) => closeOverlay(".sheet", () => { view = { ...view, sheet: null }; render(); after(); });
const confetti = () => {
  if (calm()) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const W = (c.width = innerWidth * 2), H = (c.height = innerHeight * 2), g = c.getContext("2d");
  const cols = ["#2F6BFF", "#13B5FF", "#FF5A4E", "#FFC531", "#18B87A"];
  const ps = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 26, vy: -Math.random() * 30 - 10, s: 8 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[(Math.random() * cols.length) | 0] }));
  const t0 = performance.now();
  const step = (t) => {
    g.clearRect(0, 0, W, H);
    ps.forEach((p) => { p.vy += 1.1; p.x += p.vx; p.y += p.vy; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); });
    t - t0 < 2200 ? requestAnimationFrame(step) : c.remove();
  };
  requestAnimationFrame(step);
};
const restoreUi = () => {
  try {
    const u = JSON.parse(localStorage.getItem(UI_KEY));
    if (!u) return 0;
    view = { ...view, ...u.view };
    finDraft = u.finDraft || finDraft;
    if (u.rest && u.rest.end > Date.now()) { rest = u.rest; runTick(); }
    if (S.sesion?.crono) runCrono();
    return u.y || 0;
  } catch { return 0; }
};

    });

  if (ds.unzoom != null) { closeOverlay(".lightbox", () => { view = { ...view, lightbox: false }; render(); }); return; }
  if ((ds.check != null || ds.step || ds.apply != null) && otherLive()) { toast(`Tienes ${shortTitle(dayOf(S.sesion.dia))} en marcha: termínalo antes`); return; }
  if (ds.edit != null) { view = { ...view, edit: +ds.edit, editEj: view.ej }; render(); return; }

  if ((ds.check != null || ds.step || ds.apply != null) && !S.sesion) { toast("Primero, Iniciar sesión"); return; }

    else { const j = +ds.crono.split("|")[1]; const p = calPasos(dayOf(view.dia))[j]; const st = calGen().pasos?.[j] || {}; startCrono(`cal|${j}`, st.min ?? p.min, `Calentamiento · ${pasoNombre(p, st)}`); }

  if (ds.discard != null) { closeSheet(() => { try { lock?.release(); } catch {} set((st) => ({ ...st, sesion: null })); rest = null; fx.screen = "fade"; view = { ...view, screen: "hoy", edit: null }; render(); toast("Sesión descartada"); }); return; }
  if (ds.copyh != null) { copy(coachText(S.historial[+ds.copyh])); return; }
  if (ds.pasada != null) { const i = +ds.pasada; const go = () => { set((st) => ({ ...st, historial: st.historial.map((h, j) => (j === i ? { ...h, pasada: true } : h)) })); toast("Marcada como pasada"); }; view.sheet ? closeSheet(go) : go(); return; }
  if (ds.nopasada != null) { const i = +ds.nopasada; closeSheet(() => { set((st) => ({ ...st, historial: st.historial.map((h, j) => (j === i ? { ...h, pasada: false } : h)) })); toast("De vuelta a por pasar"); }); return; }
  if (ds.copyall != null) { copy(porPasar().map(coachText).join("\n\n---\n\n")); return; }
  if (ds.delh != null) { const i = +ds.delh; closeSheet(() => { set((st) => ({ ...st, historial: st.historial.filter((_, j) => j !== i) })); toast("Sesión borrada"); }); return; }
  if (ds.export != null) { copy(JSON.stringify(S)); return; }
  if (ds.import != null) { try { const s = JSON.parse(document.getElementById("imp").value); if (s.v !== 2) throw 0; S = s; save(); closeSheet(() => toast("Restaurado")); } catch { toast("Ese texto no es una copia de seguridad de Coach"); } return; }
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset.cin && S.sesion) { const [j, field] = t.dataset.cin.split("|"); const v = t.value.replace(",", "."); if (v !== "") setCal(exercises(view.dia)[view.ej], +j, { [field]: +v }); return; }
  if (!t.dataset.in) return;
  const e = exercises(view.dia)[view.ej];
  const [k, field] = t.dataset.in.split("|");
  if (otherLive()) { toast(`Tienes ${shortTitle(dayOf(S.sesion.dia))} en marcha: termínalo antes`); render(); return; }
  if (!S.sesion) { toast("Primero, Iniciar sesión"); render(); return; }
  const v = t.value.replace(",", ".");
  updateSet(e, +k, { [field]: v === "" ? null : +v });
});
document.addEventListener("gesturestart", (ev) => ev.preventDefault());
const chartTip = (ev) => {
  const svg = ev.target.closest?.("svg[data-chart]");
  if (!svg) return;
  const d = JSON.parse(svg.dataset.tip), b = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  const px = ((ev.clientX - b.left) / b.width) * vb.width;
  const near = (p) => p.reduce((a, q) => (Math.abs(q[0] - px) < Math.abs(a[0] - px) ? q : a), p[0]);
  const hits = d.s.filter((x) => x.p.length).map((x) => ({ n: x.n, q: near(x.p) }));
  if (!hits.length) return;
  const f = hits.reduce((a, h) => (Math.abs(h.q[0] - px) < Math.abs(a.q[0] - px) ? h : a)).q;
  const l = svg.querySelector(".cur"); l.setAttribute("x1", f[0]); l.setAttribute("x2", f[0]); l.style.display = "";
  document.getElementById(`tip-${svg.dataset.chart}`).innerHTML = `<b>${dm(f[1])}</b> · ${hits.filter((h) => h.q[1] === f[1]).map((h) => `${esc(h.n)} ${fmtKg(h.q[2])} ${d.u}`).join(" · ")}`;
};
document.addEventListener("pointerdown", chartTip);
document.addEventListener("pointermove", (ev) => { if (ev.pointerType === "mouse" || ev.buttons) chartTip(ev); });
const crece = (el) => { if (el?.tagName === "TEXTAREA") { el.style.height = "auto"; el.style.height = `${el.scrollHeight + 2}px`; } };
document.addEventListener("input", (ev) => {
  crece(ev.target);
  if (ev.target.id === "notas") finDraft = { ...finDraft, notas: ev.target.value };
  if (ev.target.id === "enota") { const n = exercises(view.dia)[view.ej].nombre; S = { ...S, sesion: { ...S.sesion, notasEj: { ...(S.sesion.notasEj || {}), [n]: ev.target.value.trim() } } }; save(); }
});

setInterval(() => {
  const c = document.getElementById("clk"); if (c && S.sesion) c.textContent = hms(elapsed(S.sesion));
  const z = document.getElementById("pz"); if (z && S.sesion?.pausaDesde) z.textContent = clock(Math.floor((Date.now() - S.sesion.pausaDesde) / 1000));
}, 1000);

const y0 = restoreUi();
const SEEN_KEY = "coach-proto-visto";
const feed = () => [
  ...(DATA.novedades || []).map((n) => ({ ...n, tipo: n.version ? "rutina" : "mensaje" })),
  ...(D.avisos || []),
  ...(D.informes || []).map((i) => ({ fecha: i.fecha + "T00:00", tipo: "informe", titulo: i.titulo, texto: i.resumen })),
].sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
const unseenFeed = () => { let seen = ""; try { seen = localStorage.getItem(SEEN_KEY) || ""; } catch {} return feed().filter((n) => n.fecha > seen); };
if (unseenFeed().length) { fx.sheet = true; view = { ...view, sheet: { type: "avisos" } }; }
if (S.sesion) wake();
render();
const m0 = document.querySelector(".screen > main"); if (m0) m0.scrollTop = y0;
</script>

</body></html>
